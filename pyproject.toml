[project]
name = "blender-mcp"
version = "2.12.1"
description = "Model Context Protocol server for Blender 3D integration"
readme = "README.md"
authors = [
    { name = "BlenderMCP Contributors" },
    { name = "Yuri Schmaltz", email = "63480675+yuri-schmaltz@users.noreply.github.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "blender", "3d", "ai", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "mcp[cli]>=1.23.0,<2.0.0",  # bumped for DNS rebinding protection (GHSA-9h52-p55h-vw2f)
    "fake-bpy-module>=20230101",  # For type hints
    "requests>=2.32.4",  # bumped for .netrc credentials leak fix (GHSA-9hjg-9r4m-mvj7)
    "litellm>=1.84.0,<2.0.0",  # bumped for 15 CVEs (3 high: auth bypass, SSTI/RCE). Lock at 1.84.0.
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
test = [
    "pytest>=9.0.3",  # bumped for tmpdir handling (GHSA-6w46-j5rx-g56g)
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "blender-mcp[gui,test]",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=26.3.1",  # bumped for cache file name sanitization (GHSA-3936-cmfr-pm3m)
]

[project.scripts]
blender-mcp = "blender_mcp.cli:main"
blender-mcp-gui = "blender_mcp.gui:main"

[project.urls]
Homepage = "https://github.com/yuri-schmaltz/mcp-blender"
Repository = "https://github.com/yuri-schmaltz/mcp-blender"
Issues = "https://github.com/yuri-schmaltz/mcp-blender/issues"
Documentation = "https://github.com/yuri-schmaltz/mcp-blender#readme"
Upstream = "https://github.com/ahujasid/blender-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/blender_mcp", "addon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "e2e: end-to-end tests that use real external processes (e.g., Blender)",
    "visual: visual regression tests based on screenshot baseline",
]

[tool.coverage.run]
source = ["src/blender_mcp", "addon"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N999"]  # E501: Line too long; N999: Invalid module name (repo hyphen)

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__
"tests/*" = ["E402", "F401", "F811"]  # Allow test fixtures and path bootstrap imports
"addon.py" = ["N801"]  # Blender operator/panel naming convention
"addon/ui/*.py" = ["N801"]  # Blender panel/operator naming convention

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.pyright]
include = ["src", "addon", "."]
extraPaths = ["."]
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportInvalidTypeForm = "none"
