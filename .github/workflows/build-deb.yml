name: build-deb

# Builds the .deb on Ubuntu (matches the Debian policy used by the
# build_deb.sh script). Triggered on every push to main and on tags
# matching v*. The artifact is uploaded to the workflow run; the
# release.yml workflow (or the tag-release job) is responsible for
# attaching it to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev build-essential
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Build .deb
        run: bash scripts/build_deb.sh

      - name: Inspect .deb
        run: |
          dpkg-deb --info dist/mcp-blender_*.deb
          echo "---"
          dpkg-deb -c dist/mcp-blender_*.deb | head -10
          echo "---"
          sha256sum dist/mcp-blender_*.deb

      - name: Verify .deb is installable
        # Install into a schroot-like chroot. The simplest path that works
        # in a CI runner is `dpkg -i` + resolve missing deps with `apt-get
        # install -f -y` (best-effort; the .deb is `Architecture: all` so
        # the install location is portable across Debian/Ubuntu).
        run: |
          sudo apt-get install -y ./dist/mcp-blender_*.deb || true
          dpkg -l mcp-blender | tail -1
          ls -la /usr/lib/python3/dist-packages/blender_mcp/__init__.py
          ls -la /usr/bin/blender-mcp
          # Test that the entry point at least parses (without connecting to
          # Blender — we just want to catch import errors at install time).
          blender-mcp --version || echo "(blender-mcp --version: needs live config, non-fatal)"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-blender-${{ github.ref_name }}-${{ github.sha }}
          path: dist/mcp-blender_*.deb
          if-no-files-found: error
          retention-days: 14
