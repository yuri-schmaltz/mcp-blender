name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same PR. Saves
# ~3min of CI time per force-push and per "address review" iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"

      - name: Set up Python
        run: uv python install 3.11

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        # Use --all-extras so lint tools (ruff, mypy) are available —
        # they live under the [dev] extra, not [test] or [gui].
        run: |
          uv sync --all-extras

      - name: Build package
        # `uv run python -m pip install` doesn't work because uv-managed
        # venvs don't ship with pip. Use `uv run --with <pkg>` to pull
        # build + twine into an ephemeral layer on top of the synced venv.
        run: |
          uv run --with build --with twine python -m build
          uv run --with twine python -m twine check dist/*

      - name: Lint (ruff)
        run: |
          uv run ruff check src/ addon/
          uv run ruff format --check src/ addon/

      - name: Type check (mypy, advisory)
        # `|| true` keeps the gate advisory for now: there are 100+ untyped
        # defs in the addon and we want to fix them incrementally before
        # turning this into a hard fail.
        run: uv run mypy src/blender_mcp addon --ignore-missing-imports || true

      - name: Run core tests with coverage
        run: |
          uv run pytest tests/unit -q \
            --cov=src/blender_mcp \
            --cov=addon \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=25
        # Threshold is intentionally low (25%) for the first run. Most
        # `addon/handlers/*` modules sit at 0% in the host unit-test
        # environment because they require the Blender runtime; the
        # windows-blender-e2e job is the one that actually exercises
        # them. Bump to 40% after we add a coverage-on-Blender run, and
        # to 60% once the addon handlers have a dedicated test worktree.

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false  # don't block on codecov outages
          token: ${{ secrets.CODECOV_TOKEN }}

  gui-and-visual:
    # TODO: This job is best-effort while we investigate the offscreen
    # platform regression on Windows. The test_gui.py self-skip is in
    # place but the visual regression step still trips on something in
    # the Windows runner. `continue-on-error: true` keeps the PR mergeable
    # until the real cause is tracked down.
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run GUI and visual tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest tests/unit/test_gui.py -q
          uv run pytest tests/visual/test_gui_visual_regression.py -q

      - name: Capture GUI snapshot artifact
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
          BLENDER_MCP_VISUAL_ARTIFACT: visual-artifacts/gui_current.png
        run: python tests/visual/capture_gui_snapshot.py

      - name: Upload GUI visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-visual-artifacts
          path: visual-artifacts/

  windows-blender-e2e:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Install Blender
        shell: powershell
        run: |
          choco install blender -y --no-progress

      - name: Resolve Blender executable
        shell: powershell
        run: |
          $candidate = Get-ChildItem "C:\Program Files\Blender Foundation" -Recurse -Filter blender.exe -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($candidate) {
            "BLENDER_EXE=$($candidate.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Resolved BLENDER_EXE=$($candidate.FullName)"
          } else {
            Write-Host "Blender executable not found after installation. Test will self-skip."
          }

      - name: Run Blender E2E smoke test
        run: pytest tests/e2e/test_e2e_addon_server.py -q
