<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlenderMCP Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121214;
            --surface-color: rgba(30, 30, 35, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f0f0f0;
            --text-muted: #a0a0a5;
            --accent: #5e6ad2;
            --accent-hover: #727de3;
            --user-msg: rgba(94, 106, 210, 0.2);
            --ai-msg: rgba(255, 255, 255, 0.05);
            --sys-msg: rgba(255, 165, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(94, 106, 210, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.03), transparent 25%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 1.2rem 2rem;
            background: rgba(18, 18, 20, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #b4bcf5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            margin-left: auto;
            box-shadow: 0 0 8px #4CAF50;
        }

        /* Chat Area */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-out;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            border: 1px solid rgba(94, 106, 210, 0.3);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-msg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .message.system {
            align-self: center;
            background: var(--sys-msg);
            color: #ffa500;
            font-size: 0.85rem;
            text-align: center;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .message pre {
            background: #000;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 0.8rem;
            border: 1px solid var(--border-color);
        }

        .message code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            color: #dcdcaa;
        }

        /* Input Area */
        .input-container {
            padding: 1.5rem 2rem;
            background: rgba(30, 30, 35, 0.4);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }

        textarea {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            resize: none;
            height: 56px;
            transition: all 0.2s ease;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(94, 106, 210, 0.2);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 1.5rem;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
            transform: none;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Thinking Indicator */
        .thinking {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 0.5rem;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">B</div>
        <h1>BlenderMCP Chat</h1>
        <div class="status-dot" title="Connected"></div>
    </header>

    <div id="chat-container">
        <div class="message system">Welcome to BlenderMCP WebUI. Connect to your local Blender instance seamlessly.</div>
    </div>

    <div class="input-container">
        <textarea id="prompt-input" placeholder="Type a command for Blender..." rows="1"></textarea>
        <button id="send-btn">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        let isWaiting = false;

        function addMessage(content, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            
            // Basic markdown code block formatting
            const formattedContent = content.replace(/```python\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                                          .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                                          .replace(/\n/g, '<br>');
            
            msgDiv.innerHTML = formattedContent;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function showThinking() {
            const div = document.createElement('div');
            div.className = 'message ai thinking-msg';
            div.innerHTML = '<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const prompt = promptInput.value.trim();
            if (!prompt || isWaiting) return;

            // UI Updates
            promptInput.value = '';
            promptInput.style.height = '56px';
            addMessage(prompt, 'user');
            
            isWaiting = true;
            sendBtn.disabled = true;
            const thinkingDiv = showThinking();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                thinkingDiv.remove();

                if (!response.ok) {
                    const err = await response.json();
                    addMessage(`Error: ${err.error || response.statusText}`, 'system');
                } else {
                    const data = await response.json();
                    if (data.status === 'error') {
                        addMessage(`Error: ${data.message}`, 'system');
                    } else {
                        addMessage(data.message, 'ai');
                    }
                }
            } catch (error) {
                thinkingDiv.remove();
                addMessage(`Connection error: ${error.message}`, 'system');
            } finally {
                isWaiting = false;
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        promptInput.addEventListener('input', function() {
            this.style.height = '56px';
            this.style.height = (this.scrollHeight) + 'px';
            if (parseInt(this.style.height) > 150) {
                this.style.overflowY = 'auto';
                this.style.height = '150px';
            } else {
                this.style.overflowY = 'hidden';
            }
        });
    </script>
</body>
</html>
