# Lightweight pre-commit hooks for blender-mcp.
# Run `uvx pre-commit install` once after cloning.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast, skips e2e)
        entry: uv run pytest -q --ignore=tests/e2e
        language: system
        pass_filenames: false
        types: [python]
